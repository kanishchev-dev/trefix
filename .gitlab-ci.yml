# Deploy on the server itself: a GitLab Runner with the shell executor runs there,
# its user is in the docker group. Images are built locally, nothing goes to a registry.
#
# Application settings are plain CI/CD variables (Settings → CI/CD → Variables), one per
# key of .env.example; deploy/docker-compose.yml lists which ones reach the container.
# Optional: BACKEND_PUBLISH — host:port of the API, 127.0.0.1:3000 by default.

stages:
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  environment:
    name: production
  resource_group: production
  variables:
    COMPOSE_FILE: deploy/docker-compose.yml
  script:
    - docker network inspect trefix >/dev/null 2>&1 || docker network create trefix
    - docker compose --profile migrate build
    - docker compose up -d --wait redis
    - docker compose run --rm migrate
    - docker compose up -d --remove-orphans --wait backend
    - docker image prune -f

# Build images into the GitLab Container Registry, then deploy to the server over SSH.
#
# CI/CD variables (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY   Variable, masked/protected — private key of DEPLOY_USER
#   SSH_KNOWN_HOSTS   Variable — output of `ssh-keyscan -p <port> <host>`
#   DEPLOY_HOST       Variable — server address
#   DEPLOY_USER       Variable — user in the docker group
#   DEPLOY_PORT       Variable, optional — SSH port, 22 by default
#   DEPLOY_PATH       Variable, optional — /opt/trefix/backend by default
#   BACKEND_ENV_FILE  File, protected — the whole production .env of the backend (see .env.example)
#   BACKEND_PUBLISH   Variable, optional — host:port of the API, 127.0.0.1:3000 by default

stages:
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  MIGRATE_IMAGE: $CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_SHORT_SHA

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$CI_REGISTRY_IMAGE:latest" --target migrator -t "$MIGRATE_IMAGE" .
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$BACKEND_IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$MIGRATE_IMAGE"
    - docker push "$BACKEND_IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
  resource_group: production
  variables:
    DEPLOY_PATH: /opt/trefix/backend
    DEPLOY_PORT: "22"
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - SSH="ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
    - $SSH "mkdir -p '$DEPLOY_PATH'"
    - |
      {
        echo "BACKEND_IMAGE=$BACKEND_IMAGE"
        echo "MIGRATE_IMAGE=$MIGRATE_IMAGE"
        echo "BACKEND_PUBLISH=${BACKEND_PUBLISH:-127.0.0.1:3000}"
      } > compose.env
    - scp -P "$DEPLOY_PORT" deploy/docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - scp -P "$DEPLOY_PORT" compose.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
    - scp -P "$DEPLOY_PORT" "$BACKEND_ENV_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backend.env"
    - |
      $SSH sh -eu <<EOF
      cd '$DEPLOY_PATH'
      chmod 600 backend.env
      echo '$CI_JOB_TOKEN' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'
      docker network inspect trefix >/dev/null 2>&1 || docker network create trefix
      docker compose --profile migrate pull
      docker logout '$CI_REGISTRY'
      docker compose up -d --wait redis
      docker compose run --rm migrate
      docker compose up -d --remove-orphans --wait backend
      docker image prune -f
      EOF

# Production stack, built and started on the server by .gitlab-ci.yml.
name: trefix-frontend

services:
  web:
    image: trefix-web:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Public API URL for the browser WebSocket, inlined into the bundle at build time.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
    container_name: trefix-web
    environment:
      # Server-side calls go to the backend container over the shared trefix network.
      AUTH_BACKEND_URL: ${AUTH_BACKEND_URL:-http://trefix-backend:3000/v1}
    ports:
      - "${WEB_PUBLISH:-127.0.0.1:3001}:3001"
    restart: unless-stopped

networks:
  default:
    name: trefix
    external: true
